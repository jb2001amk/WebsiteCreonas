<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #ffffff;
    width: 100%;
    scroll-behavior: smooth;
  }

  .page-nav {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .page-nav button {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #000000;
    font-size: 16px;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s ease;
    padding: 0;
  }

  .page-nav button:hover,
  .page-nav button.active {
    opacity: 1;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
  }

  .landing-page {
    display: flex;
    flex-direction: column;
  }

  .landing {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .loop-instance {
    position: absolute;
    width: 165px;
    height: auto;
    transform: translate(-50%, -50%);
  }

  .page img.full {
    display: block;
    width: 100%;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>
<body>

  <nav class="page-nav">
    <button onclick="goToPage(1)">1</button>
    <button onclick="goToPage(2)">2</button>
    <button onclick="goToPage(3)">3</button>
    <button onclick="goToPage(4)">4</button>
    <button onclick="goToPage(5)">5</button>
  </nav>

  <section id="page1" class="page landing-page">
    <div class="landing" id="landing"></div>
    <img class="full" src="IMG_1084.JPG" alt="">
  </section>

  <section id="page2" class="page">
    <img class="full" src="IMG_1258.JPG" alt="">
  </section>

  <section id="page3" class="page">
    <img class="full" src="IMG_1442.JPG" alt="">
  </section>

  <section id="page4" class="page">
    <img class="full" src="IMG_1248.JPG" alt="">
  </section>

  <section id="page5" class="page">
    <img class="full" src="IMG_0391.JPG" alt="">
  </section>

  <script>
    function goToPage(n) {
      document.getElementById('page' + n).scrollIntoView({ behavior: 'smooth' });
    }

    // CSS reference pixel: 96px = 1in = 2.54cm
    const PX_PER_CM = 96 / 2.54;
    const SPAWN_DISTANCE = 1.05 * PX_PER_CM;

    const landing = document.getElementById('landing');
    let lastX = null;
    let lastY = null;
    let instanceCount = 0;

    landing.addEventListener('mousemove', (e) => {
      const rect = landing.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (lastX === null) {
        lastX = x;
        lastY = y;
        return;
      }

      const dist = Math.hypot(x - lastX, y - lastY);
      if (dist >= SPAWN_DISTANCE) {
        const img = document.createElement('img');
        // unique query string forces its own decode/animation timeline, independent of other instances
        img.src = 'camcorder-loop-2-1.gif?i=' + (instanceCount++);
        img.className = 'loop-instance';
        img.style.left = x + 'px';
        img.style.top = y + 'px';
        landing.appendChild(img);

        lastX = x;
        lastY = y;
      }
    });

    landing.addEventListener('click', () => {
      landing.querySelectorAll('.loop-instance').forEach((img) => img.remove());
      lastX = null;
      lastY = null;
    });
  </script>

</body>
</html>
