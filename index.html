<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #ffffff;
    width: 100%;
  }

  .landing {
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }

  .landing img {
    max-width: 90%;
    max-height: 90vh;
    display: block;
  }

  .gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
  }

  .gallery img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

  <section class="landing">
    <img src="camcorder-loop-2.gif" alt="Camcorder loop">
  </section>

  <section class="gallery">
    <img src="IMG_1248.JPG" alt="">
    <img src="IMG_1258.JPG" alt="">
    <img src="IMG_1415.JPG" alt="">
    <img src="IMG_1442.JPG" alt="">
    <img src="IMG_0051.JPG" alt="">
    <img src="IMG_0391.JPG" alt="">
    <img src="IMG_1084.JPG" alt="">
    <img src="IMG_1133.JPG" alt="">
    <img src="IMG_1236.JPG" alt="">
  </section>

</body>
</html>
