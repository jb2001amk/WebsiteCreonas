<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: #ffffff;
    width: 100%;
    scroll-behavior: smooth;
  }

  .page-nav {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .page-nav button {
    width: 32px;
    height: 20px;
    border: none;
    background: transparent;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s ease;
    padding: 0;
  }

  .page-nav button:hover,
  .page-nav button.active {
    opacity: 1;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    background: #ffffff;
  }

  .landing-page {
    display: flex;
    flex-direction: column;
  }

  .landing {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .landing-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
  }

  .loop-instance {
    position: absolute;
    width: 165px;
    height: auto;
    transform: translate(-50%, -50%);
  }

  .page img.full {
    display: block;
    width: 100%;
    height: 100vh;
    object-fit: cover;
  }

  .carousel-page {
    position: relative;
    height: 100vh;
    background: #0a0a0a;
    overflow: hidden;
    perspective: 1400px;
    perspective-origin: 50% 40%;
    cursor: grab;
    touch-action: pan-y;
  }

  .carousel-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
  }

  .carousel-page.dragging {
    cursor: grabbing;
  }

  .carousel-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }

  .carousel-item {
    position: absolute;
    width: 360px;
    height: 240px;
    margin: -120px 0 0 -180px;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform, opacity;
  }

  .carousel-item.transparent {
    background: transparent;
  }

  .carousel-item.transparent img {
    object-fit: contain;
  }

  .carousel-item img,
  .carousel-item video,
  .carousel-item canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .carousel-item {
      width: 240px;
      height: 160px;
      margin: -80px 0 0 -120px;
    }
  }
</style>
</head>
<body>

  <nav class="page-nav">
    <button onclick="goToPage(1)">1</button>
    <button onclick="goToPage(2)">2</button>
    <button onclick="goToPage(3)">3</button>
    <button onclick="goToPage(4)">4</button>
    <button onclick="goToPage(5)">5</button>  </nav>

  <section id="page1" class="page landing-page">
    <div class="landing" id="landing">
      <img class="landing-bg" src="IMG_1084.JPG" alt="">
    </div>
  </section>

  <section id="page2" class="page carousel-page">
    <img class="carousel-bg" src="IMG_1258.JPG" alt="">
    <div class="carousel-stage" id="carousel"></div>
  </section>

  <section id="page3" class="page">
    <img class="full" src="IMG_1442.JPG" alt="">
  </section>

  <section id="page4" class="page">
    <img class="full" src="IMG_1248.JPG" alt="">
  </section>

  <section id="page5" class="page">
    <img class="full" src="contact.jpeg" alt="">
  </section>

  <script>
    function goToPage(n) {
      document.getElementById('page' + n).scrollIntoView({ behavior: 'smooth' });
    }

    // CSS reference pixel: 96px = 1in = 2.54cm
    const PX_PER_CM = 96 / 2.54;
    const SPAWN_DISTANCE = 1.05 * PX_PER_CM;

    const landing = document.getElementById('landing');
    let lastX = null;
    let lastY = null;
    let instanceCount = 0;

    landing.addEventListener('mousemove', (e) => {
      const rect = landing.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (lastX === null) {
        lastX = x;
        lastY = y;
        return;
      }

      const dist = Math.hypot(x - lastX, y - lastY);
      if (dist >= SPAWN_DISTANCE) {
        const img = document.createElement('img');
        // unique query string forces its own decode/animation timeline, independent of other instances
        img.src = 'camcorder-loop-2-1.gif?i=' + (instanceCount++);
        img.className = 'loop-instance';
        img.style.left = x + 'px';
        img.style.top = y + 'px';
        landing.appendChild(img);

        lastX = x;
        lastY = y;
      }
    });

    landing.addEventListener('click', () => {
      landing.querySelectorAll('.loop-instance').forEach((img) => img.remove());
      lastX = null;
      lastY = null;
    });
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

    const ITEMS = [
      { type: 'video', src: 'Carousel/AO_GLOBE_WIREFRAME.mp4' },
      { type: 'fbx',   src: 'Carousel/BurgiScan_V2.fbx', grey: true },
      { type: 'video', src: 'Carousel/GRID.mov' },
      { type: 'image', src: 'Carousel/Bird.gif', transparent: true },
      { type: 'fbx',   src: 'Carousel/Running_E.fbx' },
      { type: 'video', src: 'Carousel/SKYLINEBILLBOARDS_V3.mp4' },
      { type: 'image', src: 'Carousel/Typo.jpg' }
    ];

    const page = document.getElementById('page2');
    const stage = document.getElementById('carousel');
    const N = ITEMS.length;
    const els = [];
    const fbxTickers = [];
    const clock = new THREE.Clock();

    function makeFbx(el, src, grey) {
      const canvas = document.createElement('canvas');
      el.appendChild(canvas);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
      const dir = new THREE.DirectionalLight(0xffffff, 2.5);
      dir.position.set(3, 5, 4);
      scene.add(dir);
      const camera = new THREE.PerspectiveCamera(35, 1.5, 0.1, 100);
      camera.position.set(0, 0.3, 4.2);
      camera.lookAt(0, 0, 0);
      const pivot = new THREE.Group();
      scene.add(pivot);
      let mixer = null;

      new FBXLoader().load(src, (obj) => {
        if (grey) {
          const mat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.65, metalness: 0, side: THREE.DoubleSide });
          obj.traverse((c) => { if (c.isMesh) c.material = mat; });
        }
        const box = new THREE.Box3().setFromObject(obj);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        obj.position.sub(center);
        pivot.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
        pivot.add(obj);
        if (obj.animations && obj.animations.length) {
          mixer = new THREE.AnimationMixer(obj);
          mixer.clipAction(obj.animations[0]).play();
        }
      }, undefined, (e) => console.error('FBX load failed:', src, e));

      fbxTickers.push((dt, t) => {
        const w = el.clientWidth, h = el.clientHeight;
        if (canvas.width !== Math.floor(w * renderer.getPixelRatio())) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        if (mixer) mixer.update(dt);
        pivot.rotation.y = t * 0.6;
        renderer.render(scene, camera);
      });
    }

    ITEMS.forEach((it) => {
      const el = document.createElement('div');
      el.className = 'carousel-item' + (it.transparent ? ' transparent' : '');
      if (it.type === 'video') {
        const v = document.createElement('video');
        v.src = it.src;
        v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
        v.preload = 'auto';
        v.play().catch(() => {});
        el.appendChild(v);
      } else if (it.type === 'image') {
        const im = document.createElement('img');
        im.src = it.src; im.alt = ''; im.draggable = false;
        el.appendChild(im);
      } else {
        makeFbx(el, it.src, it.grey);
      }
      stage.appendChild(el);
      els.push(el);
    });

    // rotation in radians: constant auto-spin, plus drag with easing back to auto speed
    const AUTO = 0.0035;
    let rot = 0, velocity = AUTO;
    let dragging = false, dragX = 0;

    page.addEventListener('pointerdown', (e) => {
      dragging = true; dragX = e.clientX;
      page.classList.add('dragging');
      page.setPointerCapture(e.pointerId);
    });
    page.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const d = (e.clientX - dragX) * 0.006;
      dragX = e.clientX;
      rot += d;
      velocity = d;
    });
    const endDrag = () => { dragging = false; page.classList.remove('dragging'); };
    page.addEventListener('pointerup', endDrag);
    page.addEventListener('pointercancel', endDrag);

    function frame() {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      if (!dragging) {
        velocity += (AUTO - velocity) * 0.03;
        rot += velocity * dt * 60;
      }
      const radius = Math.min(window.innerWidth * 0.38, 620);
      for (let i = 0; i < N; i++) {
        const a = rot + (i / N) * Math.PI * 2;
        const f = (Math.cos(a) + 1) / 2;            // 1 = front, 0 = back
        const el = els[i];
        el.style.transform = `translate3d(${Math.sin(a) * radius}px, 0, ${Math.cos(a) * radius - radius}px) scale(${(0.4 + 0.6 * f).toFixed(3)})`;
        el.style.opacity = (0.3 + 0.7 * f).toFixed(3);
        el.style.filter = `brightness(${(0.45 + 0.55 * f).toFixed(3)})`;
        el.style.zIndex = Math.round(f * 100);
      }
      fbxTickers.forEach((fn) => fn(dt, t));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>

</body>
</html>
